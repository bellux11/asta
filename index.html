<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<title>Asta Fantacalcio 2026/27 — Strategia</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f5f6fa;color:#2f3640;margin:0;padding:0}
header{background:#273c75;color:#fff;padding:18px;text-align:center;font-size:25px;font-weight:700;position:sticky;top:0;z-index:10}
.container{max-width:900px;margin:auto;padding:14px}
.budget-total{background:#192a56;color:#fff;padding:15px;border-radius:12px;text-align:center;font-size:22px;font-weight:700;margin-bottom:12px}
.strategy{background:#fff;border:1px solid #dcdde1;border-radius:10px;padding:12px;margin-bottom:12px;line-height:1.45}
.strategy strong{color:#192a56}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.reset-btn,.undo-btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}
.reset-btn{background:#c23616;color:#fff}.undo-btn{background:#718093;color:#fff}
.reparto-header{background:#dcdde1;padding:15px;border-radius:11px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:21px;font-weight:700;position:sticky;top:61px;z-index:5}
.reparto-header.completato{background:#44bd32;color:#fff}.reparto-crediti{font-size:22px;color:#192a56}.completato .reparto-crediti{color:#fff}
.reparto-content{display:none;margin-bottom:20px}
.search{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbb;border-radius:9px;font-size:17px;margin:10px 0}
.fascia{margin-top:15px;color:#273c75}
.player{padding:12px;margin:8px 0;background:#fff;border-radius:10px;border:1px solid #dcdde1;display:flex;gap:12px;justify-content:space-between;align-items:center;transition:.2s}
.player.out{opacity:.35}.player-name{font-weight:700;font-size:17px}.meta{font-size:13px;color:#636e72;margin-top:3px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:12px;padding:4px 7px;border-radius:6px;background:#f1f2f6}
.badge.base{background:#e8eaf6}.badge.range{background:#dff9fb;font-weight:700}
.badge.max{background:#ffeaa7;font-weight:700}.badge.risk{background:#fab1a0}
.player-buttons{display:flex;gap:6px;flex-shrink:0}
.player-buttons button{padding:9px 10px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
.btn-uscito{background:#dcdde1;color:#2f3640}.btn-preso{background:#44bd32;color:#fff}
.btn-undo{background:#fbc531;color:#2f3640;display:none}.player.out .btn-undo{display:block}
.player.out .btn-uscito,.player.out .btn-preso{display:none}
.note{font-size:13px;background:#fff;padding:10px;border-left:4px solid #273c75;border-radius:6px;margin:8px 0}
@media(max-width:650px){.player{flex-direction:column;align-items:stretch}.player-buttons{width:100%}.player-buttons button{flex:1}.reparto-header{top:59px}}
</style>

<style>
.auction-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}
.credits-countdown{display:flex;align-items:baseline;gap:6px}
.credits-label{font-size:.78rem;opacity:.75;letter-spacing:.08em}
#creditsRemaining{font-size:2rem;line-height:1}
.credits-total{opacity:.6}
.control-buttons{display:flex;gap:8px}
</style>

</head>
<body>
<div id="auctionControls" class="auction-controls">

    <span class="credits-total">/ 500</span>
  </div>
  <div class="control-buttons">
    <button type="button" onclick="resetAll()">RESET</button>
    <button type="button" onclick="undoLast()">ANNULLA ULTIMO</button>

</div>

<header>⚽ Asta Fantacalcio 2026/27</header>
<div class="container">

5,"TUA"],["VALUE","Gaetano","ATA","🟡","Da verificare minutaggio","G 2-6 | A 1-4",2,"5-9",12,"TUA"],["VALUE","Zerbin","FRO","🟢","Titolare/rotazione","G 2-5 | A 2-4",4,"5-9",12,"TUA"],["SCOMMESSA","Cacciamani","TOR","🟡","Da verificare","G 1-4 | A 1-3",4,"2-5",8,"TUA"]],"attacco":[["TOP","Lautaro Martínez","INT","🟢","Titolare","G 14-20 | A 4-7",null,"82-92",100,"STIMA"],["TOP","Hojlund","NAP","🟢","Titolare","G 12-18 | A 4-7",98,"82-92",100,"TUA"],["TOP","Douvikas","COM","🟢","Titolare","G 11-16 | A 3-6",100,"82-92",100,"TUA"],["TOP","Thuram","INT","🟢","Titolare","G 12-18 | A 4-7",null,"78-90",98,"STIMA"],["SEMI-TOP","Pinamonti","LAZ","🟢","Titolare centravanti","G 10-15 | A 2-5",12,"48-60",68,"TUA"],["SEMI-TOP","Pio Esposito","INT","🟡","Rotazione possibile","G 8-13 | A 2-5",null,"40-55",64,"STIMA"],["SEMI-TOP","Simeone","TOR","🟢","Titolare","G 8-13 | A 2-4",65,"42-55",63,"TUA"],["SEMI-TOP","Scamacca","ATA","🟡","Ballottaggio","G 8-13 | A 2-4",null,"35-48",56,"STIMA"],["SEMI-TOP","De Ketelaere","ATA","🟢","Titolare/trequarti","G 6-11 | A 3-6",null,"30-42",50,"STIMA"],["SEMI-TOP","Dia","LAZ","🟡","Concorrenza","G 6-11 | A 2-5",null,"26-38",45,"STIMA"],["SEMI-TOP","Krstovic","ATA","🟡","Ballottaggio con Scamacca","G 7-12 | A 2-5",50,"28-38",44,"TUA"],["TITOLARE","Castro","BOL","🟢","Titolare","G 7-11 | A 2-4",25,"22-31",37,"TUA"],["TITOLARE","Laurienté","SAS","🟢","Titolare","G 6-10 | A 3-6",30,"20-29",35,"TUA"],["TITOLARE","Esposito","INT","🟡","Minutaggio da verificare","G 5-10 | A 2-4",30,"18-27",33,"TUA"],["TITOLARE","Neres","NAP","🟡","Rotazione","G 4-8 | A 3-6",30,"17-25",31,"TUA"],["TITOLARE","Adams","TOR","🟢","Titolare/rotazione","G 5-9 | A 2-4",20,"12-18",22,"TUA"],["VALUE","Bonny","INT","🟡","Concorrenza","G 5-9 | A 2-4",null,"10-16",20,"STIMA"],["VALUE","Piccoli","BOL","🟡","Da verificare","G 5-9 | A 1-3",null,"8-14",18,"STIMA"],["SCOMMESSA","Yeboah","VEN","🟡","Da verificare","G 4-8 | A 1-3",10,"4-8",11,"TUA"],["SCOMMESSA","Ghedjemis","FRO","🟡","Da verificare","G 3-7 | A 1-3",10,"3-6",9,"TUA"],["FUORI LISTA","Malen","ROM","⛔","Escluso per strategia lega","—",null,"—",0,""]]};let res={...previsto},presi={porta:0,difesa:0,centro:0,attacco:0},resTot=500,history=[];

function render(){
  const app=document.getElementById('app'); app.innerHTML='';
  Object.keys(data).forEach(rep=>{
    const h=document.createElement('div');
    h.className='reparto-header'; h.id='header_'+rep;
    h.onclick=()=>togglePanel(rep);
    h.innerHTML=`<span>${nomiReparto[rep]} (${maxGiocatori[rep]})</span><span class="reparto-crediti" id="res${rep}">${res[rep]}</span>`;
    app.appendChild(h);
    const panel=document.createElement('div'); panel.className='reparto-content'; panel.id='panel_'+rep;
    const input=document.createElement('input'); input.className='search';
    input.placeholder='🔎 Cerca giocatore in '+nomiReparto[rep]+'...';
    input.oninput=()=>filter(rep,input.value); panel.appendChild(input);
    let last='';
    data[rep].forEach((x,i)=>{
      if(x[0]!==last){const fh=document.createElement('h3');fh.className='fascia';fh.textContent=x[0];panel.appendChild(fh);last=x[0]}
      const el=document.createElement('div'); el.className='player';
      el.dataset.name=x[1].toLowerCase(); el.dataset.rep=rep; el.id=rep+'_'+i;
      const baseBadge=x[6]!=null ? `<span class="badge base">BASE ${x[6]}</span>` : '';
      const rangeBadge=x[7]&&x[7]!=='—' ? `<span class="badge range">💰 RANGE ${x[7]}</span>` : '';
      const maxBadge=x[8]!=null&&x[8]!==''&&x[8]!==0 ? `<span class="badge max">MAX ${x[8]}</span>` : '';
      const gaBadge=x[5]&&x[5]!=='—' ? `<span class="badge">📊 ${x[5]}</span>` : '';
      el.innerHTML=`<div>
        <div class="player-name">${x[1]} <span>(${x[2]})</span></div>
        <div class="meta">${x[4]}</div>
        <div class="badges"><span class="badge">${x[3]}</span>${gaBadge}${baseBadge}${rangeBadge}${maxBadge}</div>
      </div>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito('${rep}_${i}')">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso('${rep}_${i}','${x[1].replace(/'/g,"\\'")}','${rep}')">Preso</button>
        <button class="btn-undo" onclick="ripristina('${rep}_${i}')">Ripristina</button>
      </div>`;
      panel.appendChild(el);
    });
    app.appendChild(panel);
  });
  aggiornaBudget();
}

function togglePanel(rep){const p=document.getElementById('panel_'+rep);p.style.display=p.style.display==='block'?'none':'block'}
function filter(rep,q){document.querySelectorAll('#panel_'+rep+' .player').forEach(e=>e.style.display=e.dataset.name.includes(q.toLowerCase())?'flex':'none')}
function aggiornaBudget(){document.getElementById('resTot').textContent=resTot;Object.keys(res).forEach(r=>document.getElementById('res'+r).textContent=res[r])}
function segnaUscito(id){document.getElementById(id).classList.add('out')}
function segnaPreso(id,nome,rep){
  const val=prompt('A quanti crediti hai preso '+nome+'?'); if(val===null)return;
  const spesa=Number(val);
  if(!Number.isInteger(spesa)||spesa<0){alert('Inserisci un numero intero valido.');return}
  if(spesa>resTot){alert('Non hai abbastanza crediti residui.');return}
  const el=document.getElementById(id);
  history.push({type:'purchase',id,rep,spesa,nome,beforeRes:{...res},beforeTot:resTot,beforePresi:{...presi}});
  resTot-=spesa; res[rep]-=spesa; presi[rep]++;
  el.classList.add('out');
  el.querySelector('.player-name').innerHTML=nome+' <span>('+data[rep][Number(id.split('_')[1])][2]+')</span> — <strong>preso a '+spesa+'</strong>';
  if(presi[rep]===maxGiocatori[rep])completaReparto(rep); else aggiornaBudget();
}
function completaReparto(rep){
  document.getElementById('header_'+rep).classList.add('completato');
  const residuo=res[rep];
  if(rep==='porta')res.difesa+=residuo;
  else if(rep==='difesa')res.centro+=residuo;
  else if(rep==='centro')res.attacco+=residuo;
  res[rep]=0; aggiornaBudget();
}
function ripristina(id){document.getElementById(id).classList.remove('out')}
function undoLast(){
  const h=history.pop(); if(!h){alert('Nessun acquisto da annullare.');return}
  res={...h.beforeRes}; resTot=h.beforeTot; presi={...h.beforePresi};
  const el=document.getElementById(h.id); el.classList.remove('out');
  const idx=Number(h.id.split('_')[1]);
  el.querySelector('.player-name').innerHTML=h.nome+' <span>('+data[h.rep][idx][2]+')</span>';
  Object.keys(presi).forEach(r=>{if(presi[r]<maxGiocatori[r])document.getElementById('header_'+r).classList.remove('completato')});
  aggiornaBudget();
}
function resetAll(){
  if(!confirm('ATTENZIONE: vuoi davvero azzerare tutta l’asta? Tutti gli acquisti, prezzi e giocatori usciti verranno ripristinati.'))return;
  res={...previsto};presi={porta:0,difesa:0,centro:0,attacco:0};resTot=500;history=[];render();
}
window.onload=render;
</script>

<script>
(function(){
  function syncCreditsCountdown(){
    const el = document.getElementById('creditsRemaining');
    if(!el) return;
    const candidates = ['crediti','credits','residui','remainingCredits','creditiResidui'];
    for(const id of candidates){
      const n = document.getElementById(id);
      if(n){
        const m = String(n.textContent).match(/-?\d+(?:[.,]\d+)?/);
        if(m){ el.textContent = m[0].replace(',', '.'); return; }
      }
    }
  }
  window.syncCreditsCountdown = syncCreditsCountdown;
  document.addEventListener('DOMContentLoaded', syncCreditsCountdown);
  setInterval(syncCreditsCountdown, 250);
})();
</script>


<script>
(function(){
  function syncCreditsCountdown(){
    const el=document.getElementById('creditsRemaining');
    const total=document.getElementById('resTot');
    if(el && total) el.textContent=total.textContent;
  }
  window.syncCreditsCountdown=syncCreditsCountdown;
  document.addEventListener('DOMContentLoaded',syncCreditsCountdown);
  setInterval(syncCreditsCountdown,250);
})();
</script>

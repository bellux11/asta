<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asta Fantacalcio - Mirko</title>

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6fa;
    color: #2f3640;
    margin: 0;
    padding: 0;
  }

  header {
    background: #273c75;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
  }

  .container {
    padding: 15px;
  }

  /* REPARTO HEADER */
  .reparto-header {
    background: #dcdde1;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .reparto-crediti {
    font-size: 22px;
    font-weight: bold;
    color: #192a56;
  }

  /* PLAYER ROW */
  .player {
    padding: 14px;
    margin: 10px 0;
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #dcdde1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
    font-size: 18px;
  }

  .player-name {
    font-weight: 600;
    font-size: 18px;
  }

  .player-buttons button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    margin-left: 10px;
  }

  .btn-uscito {
    background: #dcdde1;
    color: #2f3640;
  }

  .btn-preso {
    background: #44bd32;
    color: white;
  }

  .player.out {
    opacity: 0.35;
    text-decoration: line-through;
  }

  .reset-btn {
    background: #e84118;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 20px;
    width: 100%;
    margin-bottom: 25px;
  }

  /* MOBILE OPTIMIZATION */
  @media (max-width: 600px) {
    .player {
      flex-direction: column;
      align-items: flex-start;
    }
    .player-buttons {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .player-buttons button {
      flex: 1;
      margin-left: 0;
      margin-right: 10px;
    }
  }
</style>

<script>
  let budgetTotale = 500;

  let budgetPorta = 60;
  let budgetDifesa = 125;
  let budgetCentro = 180;
  let budgetAttacco = 160;

  let resPorta = 60;
  let resDifesa = 125;
  let resCentro = 180;
  let resAttacco = 160;

  function aggiornaBudget() {
    document.getElementById("resPorta").innerText = resPorta;
    document.getElementById("resDifesa").innerText = resDifesa;
    document.getElementById("resCentro").innerText = resCentro;
    document.getElementById("resAttacco").innerText = resAttacco;
  }

  function segnaUscito(el) {
    el.classList.add("out");
  }

  function segnaPreso(el, nome, reparto) {
    let spesa = prompt("A quanti crediti hai preso " + nome + "?");
    if (spesa !== null && !isNaN(spesa)) {
      spesa = parseInt(spesa);

      if (reparto === "porta") resPorta -= spesa;
      if (reparto === "difesa") resDifesa -= spesa;
      if (reparto === "centro") resCentro -= spesa;
      if (reparto === "attacco") resAttacco -= spesa;

      aggiornaBudget();
      el.classList.add("out");
    }
  }

  function resetAll() {
    resPorta = budgetPorta;
    resDifesa = budgetDifesa;
    resCentro = budgetCentro;
    resAttacco = budgetAttacco;

    aggiornaBudget();

    let players = document.querySelectorAll(".player");
    players.forEach(p => p.classList.remove("out"));
  }
</script>

</head>
<body>

<header>Asta Fantacalcio - 2026/27</header>

<div class="container">

  <button class="reset-btn" onclick="resetAll()">RESET COMPLETO</button>

  <!-- PORTIERI -->
  <div class="reparto-header">
    <span>Portieri</span>
    <span class="reparto-crediti" id="resPorta">60</span>
  </div>

  <div class="player" id="martinez">
    <span class="player-name">Martínez</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(martinez)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(martinez,'Martínez','porta')">Preso</button>
    </div>
  </div>

  <div class="player" id="meret">
    <span class="player-name">Meret</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(meret)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(meret,'Meret','porta')">Preso</button>
    </div>
  </div>

  <div class="player" id="carnesecchi">
    <span class="player-name">Carnesecchi</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(carnesecchi)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(carnesecchi,'Carnesecchi','porta')">Preso</button>
    </div>
  </div>

  <div class="player" id="vicario">
    <span class="player-name">Vicario</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(vicario)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(vicario,'Vicario','porta')">Preso</button>
    </div>
  </div>

  <!-- DIFESA -->
  <div class="reparto-header">
    <span>Difesa</span>
    <span class="reparto-crediti" id="resDifesa">125</span>
  </div>

  <div class="player" id="mancini">
    <span class="player-name">Mancini – 29</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(mancini)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(mancini,'Mancini','difesa')">Preso</button>
    </div>
  </div>

  <!-- (Qui aggiungi tutti gli altri della difesa) -->

  <!-- CENTROCAMPO -->
  <div class="reparto-header">
    <span>Centrocampo</span>
    <span class="reparto-crediti" id="resCentro">180</span>
  </div>

  <div class="player" id="chala">
    <span class="player-name">Chalanoglu – 70</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(chala)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(chala,'Chalanoglu','centro')">Preso</button>
    </div>
  </div>

  <!-- (Qui aggiungi tutti gli altri del centrocampo) -->

  <!-- ATTACCO -->
  <div class="reparto-header">
    <span>Attacco</span>
    <span class="reparto-crediti" id="resAttacco">160</span>
  </div>

  <div class="player" id="hojlund">
    <span class="player-name">Hojlund – 98</span>
    <div class="player-buttons">
      <button class="btn-uscito" onclick="segnaUscito(hojlund)">Uscito</button>
      <button class="btn-preso" onclick="segnaPreso(hojlund,'Hojlund','attacco')">Preso</button>
    </div>
  </div>

  <!-- (Qui aggiungi tutti gli altri dell’attacco) -->

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asta Fantacalcio - Mirko</title>

<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6fa;
    color: #2f3640;
    margin: 0;
    padding: 0;
  }

  header {
    background: #273c75;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
  }

  .container {
    padding: 15px;
  }

  .budget-total {
    background: #ffffff;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #dcdde1;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
  }

  .reset-btn {
    background: #e84118;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 20px;
    width: 100%;
    margin-bottom: 25px;
  }

  .reparto-header {
    background: #dcdde1;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .reparto-header.completato {
    background: #44bd32;
    color: white;
  }

  .reparto-crediti {
    font-size: 22px;
    font-weight: bold;
    color: #192a56;
  }

  .reparto-content {
    display: none;
    margin-bottom: 20px;
  }

  .player {
    padding: 14px;
    margin: 10px 0;
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #dcdde1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.2s;
    font-size: 18px;
  }

  .player-name {
    font-weight: 600;
    font-size: 18px;
  }

  .player-buttons button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    margin-left: 10px;
  }

  .btn-uscito {
    background: #dcdde1;
    color: #2f3640;
  }

  .btn-preso {
    background: #44bd32;
    color: white;
  }

  .player.out {
    opacity: 0.35;
    text-decoration: line-through;
  }

  @media (max-width: 600px) {
    .player {
      flex-direction: column;
      align-items: flex-start;
    }
    .player-buttons {
      margin-top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }
    .player-buttons button {
      flex: 1;
      margin-left: 0;
      margin-right: 10px;
    }
  }
</style>

<script>
  /* BUDGET PREVISTO */
  let previsto = {
    porta: 60,
    difesa: 125,
    centro: 180,
    attacco: 160
  };

  /* GIOCATORI PREVISTI */
  let maxGiocatori = {
    porta: 3,
    difesa: 8,
    centro: 8,
    attacco: 6
  };

  /* GIOCATORI PRESI */
  let presi = {
    porta: 0,
    difesa: 0,
    centro: 0,
    attacco: 0
  };

  /* BUDGET DINAMICO PER REPARTO (inizialmente = previsto) */
  let res = {
    porta: previsto.porta,
    difesa: previsto.difesa,
    centro: previsto.centro,
    attacco: previsto.attacco
  };

  /* TOTALE RESIDUO (solo per riferimento generale) */
  let resTot = 500;

  function aggiornaBudget() {
    document.getElementById("resTot").innerText = resTot;
    document.getElementById("resPorta").innerText = res.porta;
    document.getElementById("resDifesa").innerText = res.difesa;
    document.getElementById("resCentro").innerText = res.centro;
    document.getElementById("resAttacco").innerText = res.attacco;
  }

  function togglePanel(id) {
    let panel = document.getElementById(id);
    panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
  }

  function completaReparto(reparto) {
    let header = document.getElementById("header_" + reparto);
    header.classList.add("completato");

    // Speso reale nel reparto = previsto - residuo attuale
    let speso = previsto[reparto] - res[reparto];

    // Residuo reale (positivo se hai risparmiato, negativo se hai sforato)
    let residuo = previsto[reparto] - speso;

    // Trasferisci il residuo al reparto successivo
    if (reparto === "porta") {
      res.difesa += residuo;
    } else if (reparto === "difesa") {
      res.centro += residuo;
    } else if (reparto === "centro") {
      res.attacco += residuo;
    }

    // Il reparto completato non ha più budget residuo da mostrare
    res[reparto] = 0;

    aggiornaBudget();
  }

  function segnaUscito(el) {
    el.classList.add("out");
  }

  function segnaPreso(el, nome, reparto) {
    let spesa = prompt("A quanti crediti hai preso " + nome + "?");
    if (spesa !== null && !isNaN(spesa)) {
      spesa = parseInt(spesa);

      // Scala dal totale (solo come riferimento globale)
      resTot -= spesa;

      // Scala dal budget residuo del reparto
      res[reparto] -= spesa;

      // Incrementa giocatori presi nel reparto
      presi[reparto]++;

      // Se hai completato il numero di giocatori del reparto
      if (presi[reparto] === maxGiocatori[reparto]) {
        completaReparto(reparto);
      } else {
        aggiornaBudget();
      }

      el.classList.add("out");
    }
  }

  function resetAll() {
    resTot = 500;

    res.porta = previsto.porta;
    res.difesa = previsto.difesa;
    res.centro = previsto.centro;
    res.attacco = previsto.attacco;

    presi.porta = 0;
    presi.difesa = 0;
    presi.centro = 0;
    presi.attacco = 0;

    document.querySelectorAll(".reparto-header").forEach(h => h.classList.remove("completato"));
    document.querySelectorAll(".player").forEach(p => p.classList.remove("out"));

    aggiornaBudget();
  }

  window.onload = aggiornaBudget;
</script>

</head>
<body>

<header>Asta Fantacalcio - 2026/27</header>

<div class="container">

  <div class="budget-total">
    Crediti Totali Residui: <span id="resTot">500</span>
  </div>

  <button class="reset-btn" onclick="resetAll()">RESET COMPLETO</button>

  <!-- PORTIERI -->
  <div class="reparto-header" id="header_porta" onclick="togglePanel('panelPorta')">
    <span>Portieri (3)</span>
    <span class="reparto-crediti" id="resPorta">60</span>
  </div>

  <div class="reparto-content" id="panelPorta">
    <div class="player" id="martinez">
      <span class="player-name">Martínez</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(martinez)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(martinez,'Martínez','porta')">Preso</button>
      </div>
    </div>

    <div class="player" id="meret">
      <span class="player-name">Meret</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(meret)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(meret,'Meret','porta')">Preso</button>
      </div>
    </div>

    <div class="player" id="carnesecchi">
      <span class="player-name">Carnesecchi</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(carnesecchi)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(carnesecchi,'Carnesecchi','porta')">Preso</button>
      </div>
    </div>

    <div class="player" id="vicario">
      <span class="player-name">Vicario</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(vicario)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(vicario,'Vicario','porta')">Preso</button>
      </div>
    </div>
  </div>

  <!-- DIFESA -->
  <div class="reparto-header" id="header_difesa" onclick="togglePanel('panelDifesa')">
    <span>Difesa (8)</span>
    <span class="reparto-crediti" id="resDifesa">125</span>
  </div>

  <div class="reparto-content" id="panelDifesa">
    <div class="player" id="mancini">
      <span class="player-name">Mancini – 29</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(mancini)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(mancini,'Mancini','difesa')">Preso</button>
      </div>
    </div>

    <div class="player" id="rrahmani">
      <span class="player-name">Rrahmani – 28</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(rrahmani)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(rrahmani,'Rrahmani','difesa')">Preso</button>
      </div>
    </div>

    <div class="player" id="solet">
      <span class="player-name">Solet – 27</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(solet)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(solet,'Solet','difesa')">Preso</button>
      </div>
    </div>

    <!-- Qui puoi aggiungere tutti gli altri difensori della tua lista -->
  </div>

  <!-- CENTROCAMPO -->
  <div class="reparto-header" id="header_centro" onclick="togglePanel('panelCentro')">
    <span>Centrocampo (8)</span>
    <span class="reparto-crediti" id="resCentro">180</span>
  </div>

  <div class="reparto-content" id="panelCentro">
    <div class="player" id="chala">
      <span class="player-name">Chalanoglu – 70</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(chala)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(chala,'Chalanoglu','centro')">Preso</button>
      </div>
    </div>

    <!-- Qui puoi aggiungere tutti gli altri centrocampisti della tua lista -->
  </div>

  <!-- ATTACCO -->
  <div class="reparto-header" id="header_attacco" onclick="togglePanel('panelAttacco')">
    <span>Attacco (6)</span>
    <span class="reparto-crediti" id="resAttacco">160</span>
  </div>

  <div class="reparto-content" id="panelAttacco">
    <div class="player" id="hojlund">
      <span class="player-name">Hojlund – 98</span>
      <div class="player-buttons">
        <button class="btn-uscito" onclick="segnaUscito(hojlund)">Uscito</button>
        <button class="btn-preso" onclick="segnaPreso(hojlund,'Hojlund','attacco')">Preso</button>
      </div>
    </div>

    <!-- Qui puoi aggiungere tutti gli altri attaccanti della tua lista -->
  </div>

</div>

</body>
</html>
